<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      min-height: 150vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: url("p3.jpg") no-repeat center center fixed;
      background-size: 100% 100%;  /* exact 100% width & height */
      position: relative;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 15px;
      text-shadow: 2px 2px 5px black;
    }

    p {
      font-size: 1.1em;
      line-height: 1.6;
      margin-bottom: 20px;
      text-shadow: 1px 1px 3px black;
    }

    .btn {
      display: inline-block;
      padding: 12px 25px;
      background: #007bff;
      color: white;
      font-size: 1em;
      font-weight: bold;
      border-radius: 8px;
      transition: 0.3s;
      margin-top: 15px;
      cursor: pointer;
      border: none;
    }

    .btn:hover {
      background: #0056b3;
    }

    .photo {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .photo img {
      width: 100px;
      height: auto;
      border-radius: 8px;
      box-shadow: 2px 2px 5px black;
    }
  </style>
</head>
<body>
  <div class="content">
    <h1>Happy Birthday</h1>
    <p>
      Wishing you a very Happy Birthday, Uncle!<br>
      May your special day be filled with good health,<br>
      happiness, and countless blessings.
    </p>

    <div class="photo">
      <img src="pooja.jpg" alt="bro's Photo">
      <img src="p1.jpg" alt="sis's Photo">
      <img src="himanshu.jpg" alt="himanshu's Photo">
      <img src="p2.jpg" alt="deepak's Photo">
      <img src="krishu.jpg" alt="krishu's Photo">
      <img src="manish.jpg" alt="manish's Photo">
    </div>

    <audio id="bgm" loop>
      <source src="birthday.mp3" type="audio/mpeg">
    </audio>
    <button class="btn" onclick="document.getElementById('bgm').play()">🎵 Play Birthday Song</button>
  </div>
</body>
</html>
